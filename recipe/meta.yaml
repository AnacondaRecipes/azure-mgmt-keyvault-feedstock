{% set name = "azure-mgmt-keyvault" %}
{% set version = "13.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 56c12904e6d9ac49f886483e50e3f635d8bf43a489eb32fa7b4832f323d396c7

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vv
  skip: true  # [py<39]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=77.0.3
  run:
    - python
    - isodate >=0.6.1
    - azure-mgmt-core >=1.6.0
    - typing-extensions >=4.6.0

test:
  imports:
    - azure
    - azure.mgmt
    - azure.mgmt.keyvault
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Azure/azure-sdk-for-python
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Microsoft Azure Key Vault Management Client Library for Python
  description: |
    This is the Microsoft Azure Key Vault Management Client Library.
  doc_url: https://docs.microsoft.com/python/api/overview/azure/key-vault
  dev_url: https://github.com/Azure/azure-sdk-for-python

extra:
  recipe-maintainers:
    - andreyz4k
